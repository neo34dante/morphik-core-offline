[api]
host = "0.0.0.0"
port = 8000
reload = true

[auth]
jwt_algorithm = "HS256"
dev_mode = true  # Enabled by default for easier local development
dev_entity_id = "dev_user"  # Default dev user ID
dev_entity_type = "developer"  # Default dev entity type
dev_permissions = ["read", "write", "admin"]  # Default dev permissions

#### Registered models
[registered_models]
# OpenAI models
openai_gpt4 = { model_name = "gpt-4" }
openai_gpt4-1 = { model_name = "gpt-4.1" }
openai_gpt4o = { model_name = "gpt-4o" }
openai_gpt4o_mini = { model_name = "gpt-4o-mini" }

# Anthropic models
claude_opus = { model_name = "claude-3-opus-20240229" }
claude_sonnet = { model_name = "claude-3-7-sonnet-latest" }

# Ollama models
ollama_chat = { model_name = "ollama/llama3.2",      api_base = "http://localhost:11434" }

# Embedding models
text_embed   = { model_name = "ollama/nomic-embed-text", api_base = "http://localhost:11434" }
vision_parser  = { model_name = "ollama/llava:7b",      api_base = "http://localhost:11434", vision = true }

#### Component configurations ####

[agent]
model = "ollama_chat" # Model for the agent logic

[completion]
model = "ollama_chat"      # key from registered_models
default_max_tokens = 1024
default_temperature = 0.7 

[database]
provider = "postgres"
url = "postgresql://postgres:morphik-core@localhost:5432/morphik_db"
# Connection pool settings
pool_size = 10           # Maximum number of connections in the pool
max_overflow = 15        # Maximum number of connections that can be created beyond pool_size
pool_recycle = 3600      # Time in seconds after which a connection is recycled (1 hour)
pool_timeout = 10        # Seconds to wait for a connection from the pool
pool_pre_ping = true     # Check connection viability before using it from the pool
max_retries = 3          # Number of retries for database operations
retry_delay = 1.0        # Initial delay between retries in seconds

[embedding]
model = "text_embed"  # Reference to registered model
dimensions = 768
similarity_metric = "cosine"

[parser]
chunk_size = 6000
chunk_overlap = 300
use_unstructured_api = false
use_contextual_chunking = false
contextual_chunking_model = "ollama_chat"  # Reference to a key in registered_models

[document_analysis]
model = "ollama_chat"  # Reference to a key in registered_models

[parser.vision]
model = "vision_parser"  # Reference to a key in registered_models
frame_sample_rate = 1  # Set to -1 to disable frame captioning

[reranker]
use_reranker = true
provider = "flag"
model_name = "BAAI/bge-reranker-large"
query_max_length = 256
passage_max_length = 512
use_fp16 = true
device = "cuda" # use "cpu" if on docker and using a mac, "cuda" if cuda enabled device

[storage]
provider = "local"
storage_path = "./storage"

# [storage]
# provider = "aws-s3"
# region = "us-east-2"
# bucket_name = "morphik-s3-storage"

[vector_store]
provider = "pgvector"

[rules]
model = "ollama_chat"
batch_size = 4096

[morphik]
enable_colpali = true
mode = "self_hosted"  # "cloud" or "self_hosted"
api_domain = "api.morphik.ai"  # API domain for cloud URIs
# Only call the embedding API if colpali_mode is "api"
morphik_embedding_api_domain = "http://localhost:6000"  # endpoint for multivector embedding service
colpali_mode = "local" # "off", "local", or "api"

[redis]
host = "localhost"  # use "redis" for docker
port = 6379

[graph]
model = "ollama_chat"
enable_entity_resolution = true

[telemetry]
enabled = false
honeycomb_enabled = false
honeycomb_endpoint = ""
honeycomb_proxy_endpoint = ""
service_name = "databridge-core"
otlp_timeout = 10
otlp_max_retries = 3
otlp_retry_delay = 1
otlp_max_export_batch_size = 512
otlp_schedule_delay_millis = 5000
otlp_max_queue_size = 2048
